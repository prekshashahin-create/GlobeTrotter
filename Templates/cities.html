<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Cities - GlobeTrotter</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .navbar {
            background: #6c4df6;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            padding: 40px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .view-city-btn {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 22px;
    background: #6d45f5;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    font-weight: 600;
    transition: 0.2s;
}

.view-city-btn:hover {
    background: #5937d8;
    transform: translateY(-2px);
}

        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .city-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .city-card h2 {
            margin-top: 0;
            color: #6c4df6;
        }

        .city-card p {
            color: #666;
        }

        .view-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #6c4df6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h1>🌍 GlobeTrotter</h1>

        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/cities">Explore Cities</a>
        </div>

    </div>


    <div class="container">

        <h1>Explore Cities</h1>

        <p>Discover destinations and start planning your trip.</p>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search for a city..."
            onkeyup="searchCities()"
        >


        <div class="cities-grid" id="citiesGrid">

            {% for city in cities %}

    <div class="city-card">

        <h2>{{ city["name"] }}</h2>

        <p>
            {{ city["country"] }}
        </p>

        {% if city["description"] %}
            <p>{{ city["description"] }}</p>
        {% endif %}

        <a
            href="{{ url_for('city_details', city_id=city['id']) }}"
            class="view-city-btn"
        >
            View City
        </a>

    </div>

{% endfor %}

                <a href="{{ url_for('city_details', city_id=city['id']) }}" class="view-btn">
    View City
</a>

            </div>

            {% endfor %}

        </div>

    </div>


    <script>

        function searchCities() {

            let input =
                document.getElementById("searchInput").value.toLowerCase();

            let cards =
                document.querySelectorAll(".city-card");

            cards.forEach(function(card) {

                let cityName =
                    card.querySelector("h2").textContent.toLowerCase();

                if (cityName.includes(input)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }

            });

        }

    </script>

</body>

</html>
