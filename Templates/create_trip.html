<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Trip | GlobeTrotter</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<header class="navbar">

    <a href="{{ url_for('dashboard') }}" class="brand">
        <span class="brand-icon">✦</span>
        GlobeTrotter
    </a>

    <nav class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('explore') }}">
            Explore
        </a>

        <a href="{{ url_for('plan_trip') }}" class="active">
            Plan Trip
        </a>

    </nav>

    <a href="{{ url_for('logout') }}" class="logout-btn">
        Logout
    </a>

</header>


<main class="create-page">


    <!-- LEFT SIDE -->

    <section class="create-intro">

        <span class="eyebrow">
            NEW JOURNEY
        </span>

        <h1>
            Let's give your<br>
            next adventure<br>
            a <span>name.</span>
        </h1>

        <p>
            Every great journey starts with a simple idea.
            Tell us the basics and we'll take it from there.
        </p>


        <div class="journey-decoration">

            <div class="route-line"></div>

            <div class="route-point point-a">
                <span>✈</span>
            </div>

            <div class="route-point point-b">
                <span>📍</span>
            </div>

            <div class="route-point point-c">
                <span>✦</span>
            </div>

        </div>

    </section>


    <!-- FORM -->

    <section class="create-form-card">

        <div class="form-top">

            <div>

                <span class="form-step">
                    STEP 01 / 03
                </span>

                <h2>
                    Trip basics
                </h2>

            </div>

            <span class="form-icon">
                🧳
            </span>

        </div>


        <form method="POST"
              action="{{ url_for('create_trip') }}">


            <div class="form-group">

                <label for="name">
                    What should we call this trip?
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="e.g. Summer in Japan"
                    required
                >

            </div>


            <div class="date-row">

                <div class="form-group">

                    <label for="start_date">
                        Leaving
                    </label>

                    <input
                        type="date"
                        id="start_date"
                        name="start_date"
                        required
                    >

                </div>


                <div class="date-arrow">
                    →
                </div>


                <div class="form-group">

                    <label for="end_date">
                        Coming back
                    </label>

                    <input
                        type="date"
                        id="end_date"
                        name="end_date"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <div class="label-row">

                    <label for="description">
                        What's the vibe?
                    </label>

                    <span>
                        OPTIONAL
                    </span>

                </div>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Beach escape, food adventure, family holiday..."
                ></textarea>

            </div>


            <div class="vibe-suggestions">

                <button type="button"
                        onclick="setVibe('Beach escape')">
                    🏖 Beach
                </button>

                <button type="button"
                        onclick="setVibe('Food adventure')">
                    🍜 Food
                </button>

                <button type="button"
                        onclick="setVibe('Adventure trip')">
                    🏔 Adventure
                </button>

                <button type="button"
                        onclick="setVibe('Cultural exploration')">
                    🏛 Culture
                </button>

            </div>


            <button
                type="submit"
                class="create-submit">

                Create my journey

                <span>→</span>

            </button>


        </form>

    </section>

</main>


<footer>

    <div class="footer-brand">

        <span class="brand-icon">
            ✦
        </span>

        GlobeTrotter

    </div>

    <p>
        Your story starts here. ✈
    </p>

</footer>


<script>

function setVibe(text) {

    document.getElementById("description").value = text;

}

</script>

</body>

</html>
