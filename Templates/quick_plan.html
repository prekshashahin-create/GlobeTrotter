<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Plan | GlobeTrotter</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">
</head>

<body>

<header class="navbar">

    <a href="/dashboard" class="brand">
        <span class="brand-icon">✦</span>
        <span>GlobeTrotter</span>
    </a>

    <nav class="nav-links">

    <a href="{{ url_for('dashboard') }}">
        Dashboard
    </a>

    <a href="{{ url_for('explore') }}">
        Explore
    </a>

    <a href="{{ url_for('plan_trip') }}">
        Plan Trip
    </a>

</nav>

    <a href="/logout" class="logout-btn">Logout</a>

</header>


<main class="quick-plan-page">

    <section class="choice-hero">

        <span class="eyebrow">
            PLAN IN MINUTES
        </span>

        <h1>
            Your trip,<br>
            <span>made simple.</span>
        </h1>

        <p>
            Tell us a few things about your journey and
            we'll create a starting plan for you.
        </p>

    </section>


    <section class="quick-form-card">

        <form action="/quick-plan" method="POST">

            <div class="form-group">

                <label for="destination">
                    Where do you want to go?
                </label>

                <input
                    type="text"
                    id="destination"
                    name="destination"
                    placeholder="e.g. Paris, Tokyo, Goa..."
                    required
                >

            </div>


            <div class="date-grid">

                <div class="form-group">

                    <label for="start_date">
                        Start date
                    </label>

                    <input
                        type="date"
                        id="start_date"
                        name="start_date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="days">
                        Number of days
                    </label>

                    <input
                        type="number"
                        id="days"
                        name="days"
                        min="1"
                        max="30"
                        placeholder="5"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    What kind of trip?
                </label>

                <div class="travel-types">

                    <label class="travel-option">
                        <input type="radio"
                               name="trip_type"
                               value="Adventure"
                               required>
                        <span>🏔️</span>
                        Adventure
                    </label>

                    <label class="travel-option">
                        <input type="radio"
                               name="trip_type"
                               value="Relaxation">
                        <span>🏖️</span>
                        Relaxation
                    </label>

                    <label class="travel-option">
                        <input type="radio"
                               name="trip_type"
                               value="Culture">
                        <span>🏛️</span>
                        Culture
                    </label>

                    <label class="travel-option">
                        <input type="radio"
                               name="trip_type"
                               value="Food">
                        <span>🍜</span>
                        Food
                    </label>

                </div>

            </div>


            <button type="submit" class="create-trip-btn">
                Create my quick plan
                <span>→</span>
            </button>

        </form>

    </section>

</main>


<footer>

    <div class="footer-brand">
        <span class="brand-icon">✦</span>
        GlobeTrotter
    </div>

    <p>Plan less. Travel more. ✈</p>

</footer>

</body>
</html>
